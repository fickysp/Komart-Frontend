<!doctype html>
<html lang="id" style="visibility: hidden; opacity: 0;">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Komart - Laporan Penjualan</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

  <main class="p-4 md:p-8 max-w-7xl w-full mx-auto space-y-5 md:space-y-6">
    
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 tracking-tight">Laporan</h1>
        <p class="text-sm text-slate-500 mt-1">Ringkasan pendapatan, transaksi, dan performa menu toko.</p>
      </div>

      <div class="flex items-center gap-1.5 bg-white p-1.5 rounded-2xl border border-border/80 shadow-2xs self-start">
        <button onclick="setReportPeriod('today')" data-period="today" class="rep-period-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-blue-100 text-primary transition-colors cursor-pointer">Hari ini</button>
        <button onclick="setReportPeriod('week')" data-period="week" class="rep-period-btn px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer">7 Hari</button>
        <button onclick="setReportPeriod('month')" data-period="month" class="rep-period-btn px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100 transition-colors cursor-pointer">Bulan ini</button>
      </div>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4" id="report-kpi-grid"></div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
      

      <div class="lg:col-span-7 bg-white rounded-2xl border border-border/80 p-5 space-y-4 shadow-2xs">
        <div class="flex items-center justify-between">
          <div>
            <h2 class="font-extrabold text-base text-slate-900">Tren Pendapatan</h2>
            <p class="text-xs text-slate-400" id="report-chart-sub">Distribusi omzet per jam operasional</p>
          </div>
          <button onclick="openToast('Laporan CSV berhasil diunduh')" class="px-3.5 py-2 bg-blue-50 hover:bg-blue-100 text-primary rounded-xl text-xs font-bold transition-colors cursor-pointer">
            Ekspor CSV
          </button>
        </div>

        <div id="report-bar-chart" class="h-52 flex items-end justify-between gap-2 pt-6 px-2 border-b border-slate-100"></div>
      </div>


      <div class="lg:col-span-5 bg-white rounded-2xl border border-border/80 p-5 space-y-4 shadow-2xs">
        <div>
          <h2 class="font-extrabold text-base text-slate-900">Menu Terlaris</h2>
          <p class="text-xs text-slate-400">Berdasarkan jumlah porsi terjual</p>
        </div>

        <div id="report-top-menus" class="space-y-3.5"></div>
      </div>

    </div>
  </main>

  <script src="js/layout.js"></script>
  <script src="js/laporan.js"></script>
</body>
</html>
